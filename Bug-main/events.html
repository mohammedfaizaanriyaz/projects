  <nav>
    <div class="nav-container">
      <a class="logo" href="#">Tech Tycoons</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="members.html">Members</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>

  <section class="hero">
    <div>
      <h1>Events</h1>
    </div>

  <main>
    <section class="page">
      <div class="section-title">Upcoming Technical Events</div>
      <p>Registered events: <span class="reg-display">0</span></p>
      <div class="grid" id="events-grid">
      </div>
      <div class="grid" style="margin-top: 2rem;">
        <select id="event-category-filter">
          <option value="All">All Categories</option>
          <option value="Web">Web Development</option>
          <option value="AI">AI & ML</option>
          <option value="Security">Cybersecurity</option>
          <option value="Data">Data Science</option>
          <option value="Gaming">Gaming</option>
          <option value="Cloud">Cloud Computing</option>
          <option value="Competition">Competitions</option>
        </select>
        <select id="event-sort">
          <option value="asc">Upcoming First</option>
          <option value="desc">Date</option>
        </select>
      </div>
      <div class="grid" style="margin-top: 2rem;">
        <input type="text" class="navbar-search" placeholder="Search events..." />
      </div>
    </section>
